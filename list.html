<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Demo</title>
</head>
<body>
  <h3>My Favorite Fruits</h3>
  <h4>Unorder List Show</h4>
  <ul>
    <li>Mango</li>
    <li>Banna</li>
    <li>Pine Apple</li>
  </ul>
  <h3>My Favorite Fruits</h3>
  <h4>Order List Show</h4>
  <ol>
    <li>Mango</li>
    <li>Banna</li>
    <li>Pine Apple</li>
  </ol>
</body>
</html>
